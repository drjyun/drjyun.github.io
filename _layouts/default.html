<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ea">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/images/Jin-GPT.png' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/overrides.css' | relative_url }}">
  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>
<body class="page-{{ page.section | default: 'home' }}">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="site-header">
    <div class="shell nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Jin Ho Yun home">
        <span class="brand-mark">JY</span>
        <span class="brand-name">Jin Ho Yun</span>
      </a>
      <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span>
      </button>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}" {% if page.section == 'home' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/research/' | relative_url }}" {% if page.section == 'research' %}class="active"{% endif %}>Research</a>
        <a href="{{ '/teaching/' | relative_url }}" {% if page.section == 'teaching' %}class="active"{% endif %}>Teaching</a>
      </nav>
    </div>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="shell footer-grid">
      <div>
        <div class="footer-name">Jin Ho Yun</div>
        <p>Assistant Professor of Marketing<br>New Mexico State University</p>
      </div>
      <div class="footer-links">
        <a href="https://scholar.google.com/citations?hl=en&user=x0S_vSgAAAAJ&view_op=list_works&sortby=pubdate" target="_blank" rel="noopener"><i class="ai ai-google-scholar" aria-hidden="true"></i> Google Scholar ↗</a>
        <a href="https://papers.ssrn.com/sol3/cf_dev/AbsByAuth.cfm?per_id=4493021" target="_blank" rel="noopener"><i class="ai ai-ssrn" aria-hidden="true"></i> SSRN ↗</a>
        <a href="https://www.linkedin.com/in/jin-ho-yun-3525a9160/" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i> LinkedIn ↗</a>
        <a href="https://github.com/drjyun" target="_blank" rel="noopener"><i class="fa-brands fa-github" aria-hidden="true"></i> GitHub ↗</a>
      </div>
      <div class="footer-contact">
        <a href="mailto:drjyun@nmsu.edu">drjyun@nmsu.edu</a>
        <span>© <span id="year"></span> Jin Ho Yun</span>
      </div>
    </div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
